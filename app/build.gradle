plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kunal.waterisland'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kunal.waterisland'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.2'
    }

    sourceSets {
        // TodayView is drawn by both apps (the watch screen and the phone's style gallery).
        main.java.srcDirs += '../shared/src/main/java'
    }

    buildTypes {
        release {
            // Not debuggable. Signed with the debug key for now so it installs over existing debug builds
            // and still matches the watch app's key; use your own release key before publishing widely.
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Wearable Data Layer: syncs today's count and weekly totals with the watch app.
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
}
