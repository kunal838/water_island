plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kunal.waterisland'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kunal.waterisland'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Wearable Data Layer: syncs today's count and weekly totals with the watch app.
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
}
